# ClearSet AI — SPCS Service Specification
# Deploy with:
#   CREATE SERVICE CLEARSET_DB.CLEARSET_SCHEMA.CLEARSET_AI
#     IN COMPUTE POOL <pool_name>
#     FROM SPECIFICATION $$<contents of this file>$$
#     QUERY_WAREHOUSE = COMPUTE_WH;
#
# Replace <IMAGE_URL> with the full registry path after docker push, e.g.:
#   lhbbrso-dz87434.registry.snowflakecomputing.com/clearset_db/clearset_schema/clearset_repo/clearset-ai:latest

spec:
  containers:
    - name: clearset-ai
      image: lhbbrso-dz87434.registry.snowflakecomputing.com/clearset_db/clearset_schema/clearset_repo/clearset-ai:latest
      resources:
        requests:
          cpu: "0.5"
          memory: 512M
        limits:
          cpu: "1"
          memory: 1G
      env:
        # Port SPCS will route ingress traffic to
        PORT: "8080"
        # Snowflake injects SNOWFLAKE_HOST and SNOWFLAKE_ACCOUNT automatically.
        # The OAuth token is written to /snowflake/session/token by SPCS.
        # No passwords or PATs are configured here.
        SNOWFLAKE_DATABASE: "CLEARSET_DB"
        SNOWFLAKE_SCHEMA: "CLEARSET_SCHEMA"
        SNOWFLAKE_WAREHOUSE: "COMPUTE_WH"
        # No SNOWFLAKE_ROLE here on purpose: each request runs as the signed-in
        # Snowflake user's own default role (judges = CLEARSET_JUDGE_ROLE).
        # Pinning a role would reject judge sessions (08001 role-not-granted).
        # Feature flag: Predictive Failure Prevention API (/api/predict).
        # "false" (or removing this line) makes the route 404 and hides the
        # panel — rollback is an env var, not a redeploy of the database.
        PREDICTIVE_ENGINE_ENABLED: "true"
      readinessProbe:
        port: 8080
        path: /api/health

  endpoints:
    - name: clearset-ui
      port: 8080
      public: true

  # No external access integrations are declared.
  # Cortex Analyst REST is called via SNOWFLAKE_HOST (Snowflake-internal network)
  # using the injected OAuth token — no EAI required from inside SPCS.
