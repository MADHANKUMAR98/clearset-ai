name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  # ============================================================
  # LINT & TYPECHECK
  # ============================================================
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd server && npm ci

      - name: Run linter (oxlint)
        run: npx oxlint .

      - name: Type check
        run: npx tsc -b --noEmit

  # ============================================================
  # UNIT TESTS (node:test, no network required)
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd server && npm ci

      - name: Run test suite (45 tests)
        run: npm run server:test

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd server && npm ci

      - name: Build frontend
        run: npm run build

      - name: Build backend
        run: cd server && npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            server/dist/
          retention-days: 7

  # ============================================================
  # DOCKER BUILD & PUSH (main only, requires registry secrets)
  # ============================================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Check registry credentials are configured
        id: creds
        env:
          REGISTRY: ${{ secrets.SNOWFLAKE_REGISTRY }}
          REGISTRY_TOKEN: ${{ secrets.SNOWFLAKE_REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ secrets.SNOWFLAKE_USER }}
        run: |
          if [ -n "$REGISTRY" ] && [ -n "$REGISTRY_TOKEN" ] && [ -n "$REGISTRY_USER" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Snowflake registry secrets not configured - skipping image publish (local docker build still works)."
          fi

      - name: Checkout code
        if: steps.creds.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.creds.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Snowflake Registry
        if: steps.creds.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SNOWFLAKE_REGISTRY }}
          username: ${{ secrets.SNOWFLAKE_USER }}
          password: ${{ secrets.SNOWFLAKE_REGISTRY_TOKEN }}

      - name: Extract metadata
        if: steps.creds.outputs.available == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.SNOWFLAKE_REGISTRY }}/clearset_db/clearset_schema/clearset_repo/clearset-ai
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      - name: Build and push
        if: steps.creds.outputs.available == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # SPCS DEPLOYMENT (main only, requires Snowflake secrets)
  # ============================================================
  deploy-spcs:
    name: Deploy to SPCS
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Check Snowflake credentials are configured
        id: creds
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          if [ -n "$SNOWFLAKE_ACCOUNT" ] && [ -n "$SNOWFLAKE_USER" ] && [ -n "$SNOWFLAKE_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Snowflake account secrets not configured — skipping SPCS upgrade."
          fi

      - name: Checkout code
        if: steps.creds.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Setup Snowflake CLI
        if: steps.creds.outputs.available == 'true'
        uses: snowflakedb/snowflake-cli-action@v2
        with:
          version: latest

      - name: Upgrade SPCS service
        if: steps.creds.outputs.available == 'true'
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          snow spcs service upgrade CLEARSET_DB.CLEARSET_SCHEMA.CLEARSET_AI \
            --spec-path service-spec.yaml \
            --temporary-connection

  # ============================================================
  # SMOKE TESTS (against the deployed ingress)
  # ============================================================
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-spcs]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    env:
      PRODUCTION_URL: https://eabwoc-lhbbrso-dz87434.snowflakecomputing.app
    steps:
      - name: Check deployment is reachable (OAuth-gated endpoints expect 302)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' ${{ env.PRODUCTION_URL }}/)
          echo "Ingress HTTP status: $code"
          if [ "$code" != "302" ] && [ "$code" != "200" ]; then
            echo "::error::Ingress did not respond with 200/302 (got $code)"
            exit 1
          fi

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl -sf ${{ env.PRODUCTION_URL }}/api/health | grep -q '"snowflake":true'; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for service... ($i/10)"
            sleep 10
          done
          echo "::error::Health check failed"
          exit 1

      - name: API smoke tests
        run: |
          curl -sf ${{ env.PRODUCTION_URL }}/api/exceptions | jq '.success'
          curl -sf ${{ env.PRODUCTION_URL }}/api/trades | jq '.success'
          curl -sf ${{ env.PRODUCTION_URL }}/api/cases | jq '.success'
          curl -sf ${{ env.PRODUCTION_URL }}/api/metrics | jq '.success'
          curl -sf ${{ env.PRODUCTION_URL }}/api/slack/status | jq '.success'

  # ============================================================
  # STATUS (always runs — gives a single required check)
  # ============================================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, build]
    if: always()
    steps:
      - name: Fail if any gate failed
        run: |
          echo "lint-and-typecheck=${{ needs.lint-and-typecheck.result }}"
          echo "unit-tests=${{ needs.unit-tests.result }}"
          echo "build=${{ needs.build.result }}"
          if [ "${{ needs.lint-and-typecheck.result }}" != "success" ] \
            || [ "${{ needs.unit-tests.result }}" != "success" ] \
            || [ "${{ needs.build.result }}" != "success" ]; then
            exit 1
          fi

# ============================================================
# CONCURRENCY CONTROL
# ============================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
